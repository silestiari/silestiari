<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3F1"/>
      <stop offset="0.55" stop-color="#FFC2DF"/>
      <stop offset="1" stop-color="#F7A8D8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D6246E"/>
      <stop offset="1" stop-color="#9B3FD1"/>
    </linearGradient>
    <g id="petal">
      <path d="M0 -9 C6 -9 9 -3 6 3 C4 7 0 9 0 9 C0 9 -4 7 -6 3 C-9 -3 -6 -9 0 -9 Z" fill="#FF9AC7" opacity="0.85"/>
      <path d="M0 -9 L0 -4" stroke="#FFE3F1" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g id="spark">
      <path d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z" fill="#FFFFFF"/>
    </g>
    <style>
      .float1 { animation: bob 3.2s ease-in-out infinite; }
      .float2 { animation: bob 3.2s ease-in-out infinite; animation-delay: -1.6s; }
      .tw { animation: tw 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .tw2 { animation-delay: -0.8s; } .tw3 { animation-delay: -1.6s; }
      .fall { animation: fall 9s linear infinite; }
      .f2 { animation-delay: -3s; } .f3 { animation-delay: -6s; } .f4 { animation-delay: -1.5s; } .f5 { animation-delay: -4.5s; } .f6 { animation-delay: -7.5s; }
      .tail { animation: wag 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
      .blink { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes tw { 0%,100% { transform: scale(0.5); opacity: 0.4; } 50% { transform: scale(1.1); opacity: 1; } }
      @keyframes fall { 0% { transform: translate(0,-40px) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translate(-120px,380px) rotate(300deg); opacity: 0; } }
      @keyframes wag { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
      @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>

  <!-- soft dots -->
  <g fill="#FFFFFF" opacity="0.45">
    <circle cx="80" cy="60" r="5"/><circle cx="160" cy="280" r="4"/><circle cx="420" cy="40" r="3"/>
    <circle cx="560" cy="300" r="5"/><circle cx="760" cy="36" r="4"/><circle cx="1130" cy="290" r="5"/>
    <circle cx="1000" cy="40" r="3"/><circle cx="300" cy="310" r="3"/>
  </g>

  <!-- falling sakura petals -->
  <g class="fall"><use href="#petal" x="220" y="0"/></g>
  <g class="fall f2"><use href="#petal" x="520" y="0"/></g>
  <g class="fall f3"><use href="#petal" x="780" y="0"/></g>
  <g class="fall f4"><use href="#petal" x="980" y="0"/></g>
  <g class="fall f5"><use href="#petal" x="1150" y="0"/></g>
  <g class="fall f6"><use href="#petal" x="380" y="0"/></g>

  <!-- sparkles -->
  <use href="#spark" class="tw" x="110" y="110"/>
  <use href="#spark" class="tw tw2" x="1080" y="90"/>
  <use href="#spark" class="tw tw3" x="640" y="70"/>
  <use href="#spark" class="tw tw2" x="330" y="250"/>
  <use href="#spark" class="tw" x="870" y="265"/>

  <!-- ===== Cat 1 (left): QA cat with magnifier ===== -->
  <g class="float1">
    <g transform="translate(150,215)">
      <!-- tail -->
      <path class="tail" d="M58 40 C95 30 100 -10 82 -22" stroke="#FFFFFF" stroke-width="16" fill="none" stroke-linecap="round"/>
      <path class="tail" d="M58 40 C95 30 100 -10 82 -22" stroke="#F5C6DC" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="1 200" stroke-dashoffset="-120"/>
      <!-- body -->
      <ellipse cx="0" cy="45" rx="62" ry="48" fill="#FFFFFF" stroke="#E87BAE" stroke-width="3"/>
      <!-- ears -->
      <path d="M-58 -30 L-50 -95 L-10 -58 Z" fill="#FFFFFF" stroke="#E87BAE" stroke-width="3" stroke-linejoin="round"/>
      <path d="M58 -30 L50 -95 L10 -58 Z" fill="#FFFFFF" stroke="#E87BAE" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-48 -42 L-44 -80 L-22 -60 Z" fill="#FFB3D1"/>
      <path d="M48 -42 L44 -80 L22 -60 Z" fill="#FFB3D1"/>
      <!-- head -->
      <ellipse cx="0" cy="-20" rx="70" ry="56" fill="#FFFFFF" stroke="#E87BAE" stroke-width="3"/>
      <!-- bow -->
      <g transform="translate(-42,-62)">
        <path d="M0 0 L-20 -12 L-18 12 Z" fill="#FF5FA2"/>
        <path d="M0 0 L20 -12 L18 12 Z" fill="#FF5FA2"/>
        <circle r="6" fill="#E0307E"/>
      </g>
      <!-- eyes (big anime) -->
      <g class="blink">
        <ellipse cx="-26" cy="-18" rx="13" ry="16" fill="#3A1E4D"/>
        <ellipse cx="26" cy="-18" rx="13" ry="16" fill="#3A1E4D"/>
        <ellipse cx="-26" cy="-12" rx="9" ry="8" fill="#9B3FD1" opacity="0.6"/>
        <ellipse cx="26" cy="-12" rx="9" ry="8" fill="#9B3FD1" opacity="0.6"/>
        <circle cx="-30" cy="-24" r="5" fill="#FFFFFF"/>
        <circle cx="22" cy="-24" r="5" fill="#FFFFFF"/>
        <circle cx="-21" cy="-11" r="2.5" fill="#FFFFFF"/>
        <circle cx="31" cy="-11" r="2.5" fill="#FFFFFF"/>
      </g>
      <!-- blush -->
      <ellipse cx="-46" cy="4" rx="12" ry="6" fill="#FF8FBF" opacity="0.7"/>
      <ellipse cx="46" cy="4" rx="12" ry="6" fill="#FF8FBF" opacity="0.7"/>
      <!-- nose & mouth -->
      <path d="M-4 0 L4 0 L0 5 Z" fill="#FF6FA8"/>
      <path d="M-12 8 Q-6 14 0 8 Q6 14 12 8" stroke="#3A1E4D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- whiskers -->
      <g stroke="#E87BAE" stroke-width="2" stroke-linecap="round">
        <path d="M-60 -4 L-82 -8"/><path d="M-60 4 L-82 6"/>
        <path d="M60 -4 L82 -8"/><path d="M60 4 L82 6"/>
      </g>
      <!-- paws + magnifier -->
      <g transform="translate(-58,52) rotate(-25)">
        <rect x="-4" y="0" width="8" height="40" rx="4" fill="#9B3FD1"/>
        <circle cx="0" cy="-16" r="20" fill="#E9F6FF" fill-opacity="0.7" stroke="#9B3FD1" stroke-width="6"/>
        <path d="M-8 -24 Q-2 -30 6 -26" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
      <ellipse cx="-40" cy="60" rx="14" ry="11" fill="#FFFFFF" stroke="#E87BAE" stroke-width="3"/>
      <ellipse cx="34" cy="74" rx="14" ry="11" fill="#FFFFFF" stroke="#E87BAE" stroke-width="3"/>
      <!-- tiny bug being inspected -->
      <g transform="translate(-118,10)">
        <ellipse rx="7" ry="9" fill="#3A1E4D"/>
        <path d="M-7 -2 L-13 -6 M-7 3 L-13 4 M7 -2 L13 -6 M7 3 L13 4 M-3 -9 L-6 -15 M3 -9 L6 -15" stroke="#3A1E4D" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- ===== Cat 2 (right): gamer cat with controller ===== -->
  <g class="float2">
    <g transform="translate(1040,215)">
      <path class="tail" d="M-58 40 C-95 30 -100 -10 -82 -22" stroke="#FFD6E8" stroke-width="16" fill="none" stroke-linecap="round"/>
      <ellipse cx="0" cy="45" rx="62" ry="48" fill="#FFD6E8" stroke="#C25BA5" stroke-width="3"/>
      <path d="M-58 -30 L-50 -95 L-10 -58 Z" fill="#FFD6E8" stroke="#C25BA5" stroke-width="3" stroke-linejoin="round"/>
      <path d="M58 -30 L50 -95 L10 -58 Z" fill="#FFD6E8" stroke="#C25BA5" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-48 -42 L-44 -80 L-22 -60 Z" fill="#FF9AC7"/>
      <path d="M48 -42 L44 -80 L22 -60 Z" fill="#FF9AC7"/>
      <ellipse cx="0" cy="-20" rx="70" ry="56" fill="#FFD6E8" stroke="#C25BA5" stroke-width="3"/>
      <!-- headphones -->
      <path d="M-66 -20 C-66 -96 66 -96 66 -20" stroke="#9B3FD1" stroke-width="9" fill="none" stroke-linecap="round"/>
      <rect x="-80" y="-36" width="22" height="36" rx="10" fill="#9B3FD1"/>
      <rect x="58" y="-36" width="22" height="36" rx="10" fill="#9B3FD1"/>
      <circle cx="-69" cy="-18" r="5" fill="#FF8FBF"/>
      <circle cx="69" cy="-18" r="5" fill="#FF8FBF"/>
      <!-- happy closed eyes ^ ^ -->
      <path d="M-38 -16 Q-26 -32 -14 -16" stroke="#3A1E4D" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M14 -16 Q26 -32 38 -16" stroke="#3A1E4D" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="-44" cy="4" rx="12" ry="6" fill="#FF6FA8" opacity="0.7"/>
      <ellipse cx="44" cy="4" rx="12" ry="6" fill="#FF6FA8" opacity="0.7"/>
      <path d="M-4 0 L4 0 L0 5 Z" fill="#E0307E"/>
      <path d="M-10 9 Q0 22 10 9 Z" fill="#E0307E"/>
      <g stroke="#C25BA5" stroke-width="2" stroke-linecap="round">
        <path d="M-58 -2 L-78 -6"/><path d="M-58 6 L-78 8"/>
        <path d="M58 -2 L78 -6"/><path d="M58 6 L78 8"/>
      </g>
      <!-- controller -->
      <g transform="translate(0,58)">
        <path d="M-46 -14 H46 C62 -14 66 22 52 26 C42 29 36 16 26 14 H-26 C-36 16 -42 29 -52 26 C-66 22 -62 -14 -46 -14 Z" fill="#9B3FD1"/>
        <rect x="-38" y="-3" width="16" height="5" rx="2" fill="#FFFFFF"/>
        <rect x="-32.5" y="-8.5" width="5" height="16" rx="2" fill="#FFFFFF"/>
        <circle cx="28" cy="-4" r="4" fill="#FF8FBF"/>
        <circle cx="38" cy="4" r="4" fill="#7FE3C4"/>
        <circle cx="20" cy="4" r="4" fill="#FFE27A"/>
      </g>
      <ellipse cx="-36" cy="54" rx="13" ry="10" fill="#FFD6E8" stroke="#C25BA5" stroke-width="3"/>
      <ellipse cx="36" cy="54" rx="13" ry="10" fill="#FFD6E8" stroke="#C25BA5" stroke-width="3"/>
    </g>
  </g>

  <!-- floating hearts -->
  <g fill="#FF5FA2">
    <path class="tw" d="M300 100 c-6 -10 -20 -6 -18 4 c2 8 18 18 18 18 s16 -10 18 -18 c2 -10 -12 -14 -18 -4 z"/>
    <path class="tw tw3" d="M905 120 c-4 -7 -14 -4 -13 3 c1 6 13 13 13 13 s12 -7 13 -13 c1 -7 -9 -10 -13 -3 z"/>
  </g>

  <!-- text -->
  <text x="600" y="150" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="800" fill="url(#title)">Sofia Stetsiuk</text>
  <text x="600" y="200" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#7A2E63">QA Engineer  ✦  Game Designer</text>
  <g transform="translate(600,250)">
    <rect x="-210" y="-22" width="420" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.75"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#C2185B">testing experiences · designing worlds  =^･ω･^=</text>
  </g>
</svg>
